<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Whitewater Expeditions</title>
  <meta name="description" content="Contact Whitewater Expeditions for trip reservations, group bookings, directions to our Salmon River outpost, and guide support.">
  <meta name="author" content="useruser1212">
  <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
  <header>
    <a class="logo-link" href="index.html">
      <img src="images/logo.svg" alt="Whitewater Expeditions Logo" width="120" height="80">
    </a>
    <nav aria-label="Main Navigation">
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="trips.html">Trips</a>
      <a href="contact.html" class="active">Contact Us</a>
    </nav>
  </header>

  <main>
    <section class="contact-intro" aria-label="Company Contact Information">
      <h1>Whitewater Expeditions</h1>
      <p>418 Riverbend Way, Salmon, ID 83467</p>
      <p>(208) 555-0148 &bull; Daily, 7:00 AM &ndash; 7:00 PM MT</p>
      <p>info@whitewaterexpeditions.example</p>
    </section>

    <section class="contact-layout" aria-label="Map and Contact Form">
      <div class="panel-card map-panel">
        <iframe
          class="map-frame"
          title="Salmon Idaho River Outpost Map"
          src="https://www.google.com/maps?q=Salmon,+ID+83467&output=embed"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade">
        </iframe>
      </div>

      <div class="panel-card">
        <form class="contact-form" action="#" method="get">
          <div class="form-field">
            <label for="contact-name">Name</label>
            <input type="text" id="contact-name" name="contact-name" placeholder="Alex Rivera" required>
          </div>

          <div class="form-field">
            <label for="contact-email">Email</label>
            <input type="email" id="contact-email" name="contact-email" placeholder="alex@example.com" required>
          </div>

          <fieldset class="radio-group">
            <legend>Message Purpose</legend>
            <label class="radio-option" for="purpose-general">
              <input type="radio" id="purpose-general" name="message-purpose" value="general" checked>
              General Inquiry
            </label>
            <label class="radio-option" for="purpose-reservation">
              <input type="radio" id="purpose-reservation" name="message-purpose" value="reservation">
              Reservation Question
            </label>
            <label class="radio-option" for="purpose-website">
              <input type="radio" id="purpose-website" name="message-purpose" value="website">
              Website Suggestion
            </label>
          </fieldset>

          <div class="form-field">
            <label for="contact-message">Message</label>
            <textarea id="contact-message" name="contact-message" rows="4" placeholder="Type here..." required></textarea>
          </div>

          <label class="checkbox-option" for="monthly-newsletter">
            <input type="checkbox" id="monthly-newsletter" name="monthly-newsletter" value="yes">
            Please subscribe me to the monthly newsletter
          </label>

          <button type="submit">Get in Touch!</button>
        </form>
      </div>
    </section>

    <section class="team-section" aria-label="Meet Our River Team">
      <h2>We Are Here to Serve You</h2>
      <div class="team-grid">
        <figure class="team-card">
          <img src="images/guide-elena.webp" alt="Elena Vance, Lead Expedition Director" width="400" height="400">
          <figcaption>Elena Vance &mdash; Lead Expedition Director</figcaption>
        </figure>
        <figure class="team-card">
          <img src="images/guide-marcus.webp" alt="Marcus Reed, Senior Whitewater Guide" width="400" height="400">
          <figcaption>Marcus Reed &mdash; Senior Whitewater Guide</figcaption>
        </figure>
        <figure class="team-card">
          <img src="images/guide-tessa.webp" alt="Tessa Holloway, Guest Reservations Coordinator" width="400" height="400">
          <figcaption>Tessa Holloway &mdash; Guest Reservations Coordinator</figcaption>
        </figure>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 | Whitewater Expeditions | useruser1212</p>
    <nav class="socialmedia" aria-label="Social Media Links">
      <a href="https://facebook.com"><img src="images/icon-facebook.svg" alt="Facebook" width="32" height="32"></a>
      <a href="https://instagram.com"><img src="images/icon-instagram.svg" alt="Instagram" width="32" height="32"></a>
      <a href="https://youtube.com"><img src="images/icon-youtube.svg" alt="YouTube" width="32" height="32"></a>
    </nav>
  </footer>
</body>
</html>
